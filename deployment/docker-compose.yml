version: '3.8'

services:
  # Oracle Database
  oracle-db:
    image: container-registry.oracle.com/database/express:21.3.0-xe
    container_name: gms-oracle-db
    environment:
      - ORACLE_PWD=Oracle@2024
      - ORACLE_CHARACTERSET=AL32UTF8
    ports:
      - "1521:1521"
      - "5500:5500"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database/schema:/opt/oracle/scripts/setup
      - ./database/security-policies:/opt/oracle/scripts/security
      - ./database/sample-data:/opt/oracle/scripts/data
    networks:
      - gms-network
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "sys/Oracle@2024@//localhost:1521/XE", "as", "sysdba", "@/opt/oracle/scripts/healthcheck.sql"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: gms-backend
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@oracle-db:1521:XE
      - SPRING_DATASOURCE_USERNAME=GMS_APP
      - SPRING_DATASOURCE_PASSWORD=App@2024#Connect
      - JWT_SECRET=b2E9Z3JhZGVfbWFuYWdlbWVudF9zeXN0ZW1fc2VjcmV0X2tleV8yMDI0X3VuaXZlcnNpdHk=
    ports:
      - "8080:8080"
    depends_on:
      oracle-db:
        condition: service_healthy
    networks:
      - gms-network
    volumes:
      - ./logs/backend:/app/logs
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: gms-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api
      - NODE_ENV=production
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - gms-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: gms-redis
    ports:
      - "6379:6379"
    networks:
      - gms-network
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Prometheus for monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: gms-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - gms-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: gms-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - gms-network
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  gms-network:
    driver: bridge

volumes:
  oracle-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local